<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FLOWA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #090909;
      --surface: #101010;
      --surface-2: #161616;
      --border: #1e1e1e;
      --border-2: #2a2a2a;
      --text: #c9c9c9;
      --text-muted: #555;
      --text-dim: #2e2e2e;
      --accent: #00e599;
      --accent-dim: rgba(0, 229, 153, 0.08);
      --accent-mid: rgba(0, 229, 153, 0.2);
      --red: #ff5c5c;
      --red-dim: rgba(255, 92, 92, 0.08);
      --orange: #ffaa44;
      --blue: #4d9fff;
      --blue-dim: rgba(77, 159, 255, 0.08);
      --font: 'JetBrains Mono', 'Fira Code', monospace;
      --r: 3px;
      --ease: 120ms ease;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 12.5px;
      line-height: 1.65;
      min-height: 100vh;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 28px;
      height: 44px;
    }

    .logo {
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .logo-icon {
      width: 22px;
      height: 22px;
      object-fit: contain;
      display: inline-block;
    }

    nav {
      display: flex;
      gap: 2px;
      margin-left: 4px;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 11.5px;
      padding: 4px 12px;
      border-radius: var(--r);
      transition: color var(--ease), background var(--ease);
      cursor: pointer;
    }

    nav a:hover { color: var(--text); background: var(--surface-2); }
    nav a.active { color: var(--accent); background: var(--accent-dim); }

    .header-right {
      margin-left: auto;
      color: var(--text-dim);
      font-size: 11px;
    }

    .main {
      max-width: 980px;
      margin: 0 auto;
      padding: 36px 28px 80px;
    }

    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 0;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .breadcrumb .crumb {
      cursor: pointer;
      transition: color var(--ease);
    }

    .breadcrumb .crumb:hover { color: var(--accent); }
    .breadcrumb .sep { margin: 0 8px; color: var(--text-dim); }
    .breadcrumb .current { color: var(--text); }

    /* ── Workspace groups ─────────────────────────── */
    .workspace-group {
      margin-bottom: 20px;
    }

    .workspace-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      cursor: pointer;
      user-select: none;
      transition: border-color var(--ease);
      margin-bottom: 1px;
    }

    .workspace-header:hover { border-color: var(--border-2); }

    .workspace-header.open {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      border-color: var(--border-2);
    }

    .workspace-chevron {
      color: var(--text-muted);
      font-size: 10px;
      transition: transform var(--ease);
      flex-shrink: 0;
    }

    .workspace-header.open .workspace-chevron { transform: rotate(90deg); }

    .workspace-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      flex: 1;
    }

    .workspace-count {
      font-size: 10px;
      color: var(--text-muted);
    }

    .workspace-body {
      display: none;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border-2);
      border-top: none;
      border-radius: 0 0 var(--r) var(--r);
    }

    .workspace-body.open { display: block; }

    /* ── Pipeline grid & cards ───────────────────── */
    .pipeline-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }

    .pipeline-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 18px 20px;
      transition: border-color var(--ease);
    }

    .workspace-body .pipeline-card {
      background: var(--bg);
    }

    .pipeline-card:hover { border-color: var(--border-2); }

    .card-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
    }

    .card-file {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    /* depends_on tree */
    .card-deps {
      margin-bottom: 12px;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      font-size: 10.5px;
      color: var(--text-muted);
      line-height: 1.8;
    }

    .workspace-body .card-deps {
      background: var(--surface);
    }

    .card-deps-title {
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .dep-line { white-space: pre; }
    .dep-leaf { color: var(--text); }
    .dep-dep { color: var(--accent); font-size: 10px; }

    .card-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 5px 14px;
      border: 1px solid var(--border-2);
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font);
      font-size: 11.5px;
      border-radius: var(--r);
      cursor: pointer;
      transition: all var(--ease);
      outline: none;
    }

    .btn:hover { border-color: var(--text-muted); color: var(--text); background: var(--surface-2); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn.primary { border-color: var(--accent); color: var(--accent); }
    .btn.primary:hover { background: var(--accent-dim); }

    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.danger:hover { background: var(--red-dim); }

    .btn.sm { padding: 3px 10px; font-size: 11px; }

    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 7px;
      border-radius: 10px;
      border: 1px solid var(--border-2);
      color: var(--text-muted);
      background: var(--surface-2);
    }

    .badge.scheduled { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .badge.teams { border-color: #7b68ee; color: #7b68ee; background: rgba(123,104,238,0.08); }
    .badge.running { border-color: var(--blue); color: var(--blue); background: var(--blue-dim); }

    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }

    th {
      text-align: left;
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: var(--surface-2); }
    tr:last-child td { border-bottom: none; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      font-weight: 500;
      white-space: nowrap;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-SUCCESS { color: var(--accent); }
    .status-SUCCESS .dot { background: var(--accent); box-shadow: 0 0 5px var(--accent); }
    .status-FAILED { color: var(--red); }
    .status-FAILED .dot { background: var(--red); }
    .status-RUNNING { color: var(--blue); }
    .status-RUNNING .dot { background: var(--blue); animation: pulse 1.4s ease-in-out infinite; }
    .status-STOPPED { color: var(--orange); }
    .status-STOPPED .dot { background: var(--orange); }
    .status-SKIPPED { color: var(--text-muted); }
    .status-SKIPPED .dot { background: var(--border-2); }
    .status-FAILED-IGNORED { color: var(--orange); }
    .status-FAILED-IGNORED .dot { background: var(--orange); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.7); }
    }

    .run-meta {
      display: flex;
      gap: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      margin-bottom: 28px;
      overflow: hidden;
    }

    .run-meta-cell {
      padding: 14px 20px;
      border-right: 1px solid var(--border);
      flex: 0 0 auto;
    }

    .run-meta-cell:last-child { border-right: none; flex: 1; }

    .meta-label {
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .meta-value { font-size: 12px; color: var(--text); }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .log-filename { font-size: 11px; color: var(--text-muted); }
    .log-filename span { color: var(--text); }

    .log-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 20px 24px;
      font-size: 12px;
      line-height: 1.75;
      white-space: pre;
      overflow: auto;
      max-height: 620px;
      color: #aaa;
      tab-size: 4;
    }

    .log-content::-webkit-scrollbar { width: 6px; height: 6px; }
    .log-content::-webkit-scrollbar-track { background: transparent; }
    .log-content::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 0;
      color: var(--text-muted);
      gap: 10px;
    }

    .empty-glyph { font-size: 28px; color: var(--border-2); }
    .empty-title { font-size: 13px; color: var(--text-muted); }
    .empty-sub { font-size: 11px; color: var(--text-dim); }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 0;
      color: var(--text-muted);
      font-size: 11px;
      gap: 8px;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border-2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 10px 18px;
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      border-radius: var(--r);
      font-size: 12px;
      z-index: 999;
      display: none;
      animation: toast-in 180ms ease;
      pointer-events: none;
    }

    .toast.ok { border-color: var(--accent); color: var(--accent); }
    .toast.err { border-color: var(--red); color: var(--red); }

    @keyframes toast-in {
      from { transform: translateY(6px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    code { color: var(--accent); font-family: var(--font); }
    .mono { font-family: var(--font); }
    .dim { color: var(--text-muted); }

    /* ── Dashboard ───────────────────────────────── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 18px 20px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
    }

    .chart-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      align-items: flex-start;
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 18px 20px;
      flex: 1;
    }

    .chart-card.fixed { flex: 0 0 auto; min-width: 168px; }

    .chart-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .donut-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .chart-legend { display: flex; gap: 16px; margin-top: 10px; }
    .chart-legend span { font-size: 10px; color: var(--text-muted); }

    /* ── Leaf canvas ─────────────────────────────── */
    #leaf-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.38;
    }

    .header, .main { position: relative; z-index: 1; }

    /* ── Enhanced animations ─────────────────────── */

    /* Cards fade + slide in on render */
    @keyframes card-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .pipeline-card {
      animation: card-in 260ms ease both;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .pipeline-card:hover {
      border-color: var(--border-2);
      box-shadow: 0 0 0 1px var(--border-2), 0 4px 24px rgba(0,229,153,0.04);
      transform: translateY(-1px);
    }

    /* Stagger cards */
    .pipeline-card:nth-child(1) { animation-delay: 30ms; }
    .pipeline-card:nth-child(2) { animation-delay: 60ms; }
    .pipeline-card:nth-child(3) { animation-delay: 90ms; }
    .pipeline-card:nth-child(4) { animation-delay: 120ms; }
    .pipeline-card:nth-child(5) { animation-delay: 150ms; }
    .pipeline-card:nth-child(6) { animation-delay: 180ms; }

    /* Stat cards */
    @keyframes stat-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .stat-card {
      animation: stat-in 300ms ease both;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .stat-card:nth-child(1) { animation-delay: 0ms; }
    .stat-card:nth-child(2) { animation-delay: 60ms; }
    .stat-card:nth-child(3) { animation-delay: 120ms; }
    .stat-card:nth-child(4) { animation-delay: 180ms; }

    .stat-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-mid), inset 0 0 32px rgba(0,229,153,0.03);
    }

    /* Buttons */
    .btn {
      transition: all 150ms ease;
    }

    .btn:not(:disabled):active {
      transform: scale(0.96);
    }

    .btn.primary:hover {
      background: var(--accent-dim);
      box-shadow: 0 0 12px rgba(0,229,153,0.15);
    }

    /* Running dot — stronger pulse */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1);   box-shadow: 0 0 0 0 rgba(77,159,255,0.6); }
      50%       { opacity: 0.7; transform: scale(1.3); box-shadow: 0 0 0 4px rgba(77,159,255,0); }
    }

    /* Success dot glow */
    .status-SUCCESS .dot {
      animation: glow-green 2.4s ease-in-out infinite;
    }

    @keyframes glow-green {
      0%, 100% { box-shadow: 0 0 4px var(--accent); }
      50%       { box-shadow: 0 0 10px var(--accent), 0 0 20px rgba(0,229,153,0.3); }
    }

    /* Logo hover */
    .logo {
      transition: opacity 160ms ease;
    }
    .logo:hover { opacity: 0.8; }

    /* Workspace header */
    .workspace-header {
      transition: border-color 160ms ease, background 160ms ease;
    }
    .workspace-header:hover {
      background: var(--surface-2);
    }

    /* Nav links */
    nav a {
      transition: color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }
    nav a.active {
      box-shadow: inset 0 -1px 0 var(--accent);
    }

    /* Toast */
    @keyframes toast-in {
      from { transform: translateY(10px); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }

    @keyframes toast-out {
      from { transform: translateY(0);   opacity: 1; }
      to   { transform: translateY(6px); opacity: 0; }
    }

    /* Table rows */
    tr.clickable {
      transition: background 120ms ease;
    }

    tr.clickable:hover td {
      background: var(--surface-2);
    }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>

  <canvas id="leaf-canvas"></canvas>

  <header class="header">
    <div class="logo" onclick="go('/pipelines')">
      <img class="logo-icon" src="/ui/flowa_logo.png" alt="flowa">FLOWA
    </div>
    <nav>
      <a data-nav="dashboard" onclick="go('/dashboard')">dashboard</a>
      <a data-nav="pipelines" onclick="go('/pipelines')">pipelines</a>
      <a data-nav="history" onclick="go('/history')">history</a>
    </nav>
    <div class="header-right" id="header-right"></div>
  </header>

  <main class="main" id="main">
    <div class="loading">
      <div class="spinner"></div> loading
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    'use strict';

    let _refreshTimer = null;

    function go(path) {
      clearRefresh();
      history.pushState({}, '', location.pathname + '#' + path);
      render();
    }

    function currentRoute() {
      const hash = location.hash.slice(1) || '/dashboard';
      const parts = hash.split('/').filter(Boolean);
      return parts;
    }

    function clearRefresh() {
      clearTimeout(_refreshTimer);
      _refreshTimer = null;
    }

    const api = {
      async _get(path) {
        const r = await fetch(path);
        if (!r.ok) {
          const txt = await r.text();
          let detail;
          try { detail = JSON.parse(txt).detail; } catch { detail = txt; }
          throw new Error(detail || r.statusText);
        }
        return r.json();
      },
      async _post(path) {
        const r = await fetch(path, { method: 'POST' });
        if (!r.ok) {
          const txt = await r.text();
          let detail;
          try { detail = JSON.parse(txt).detail; } catch { detail = txt; }
          throw new Error(detail || r.statusText);
        }
        return r.json();
      },
      stats: () => api._get('/stats'),
      pipelines: () => api._get('/pipelines'),
      runs: (name, limit) => api._get(`/runs?${name ? `pipeline=${encodeURIComponent(name)}&` : ''}limit=${limit || 60}`),
      run: (id) => api._get(`/runs/${id}`),
      logs: (id, step) => api._get(`/runs/${id}/steps/${encodeURIComponent(step)}/logs`),
      trigger: (name) => api._post(`/pipelines/${encodeURIComponent(name)}/run`),
      stop: (runId) => api._post(`/runs/${runId}/stop`),
    };

    function dur(a, b) {
      if (!a || !b) return '—';
      const s = Math.round((new Date(b) - new Date(a)) / 1000);
      if (s < 60) return s + 's';
      if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
      return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
    }

    function ago(iso) {
      if (!iso) return '—';
      const s = Math.round((Date.now() - new Date(iso)) / 1000);
      if (s < 60) return s + 's ago';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      return Math.floor(s / 86400) + 'd ago';
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      return iso.replace('T', ' ').slice(0, 19);
    }

    function fmtDur(s) {
      if (s == null) return '—';
      s = Math.round(s);
      if (s < 60) return s + 's';
      if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
      return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function statusHtml(status) {
      const cls = status.replace(/[\s()]/g, '-').replace(/-+/g, '-');
      const icons = {
        'SUCCESS': '✓', 'FAILED': '✗', 'FAILED (ignored)': '~',
        'SKIPPED': '—', 'RUNNING': '↻', 'STOPPED': '⏹',
      };
      const icon = icons[status] ?? '?';
      return `<span class="status status-${cls}"><span class="dot"></span>${icon} ${esc(status)}</span>`;
    }

    function toast(msg, type = 'ok') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `toast ${type}`;

    // Build a simple dependency tree from steps array
    function buildDepsTree(steps) {
      if (!steps || steps.length === 0) return '';
      const hasDeps = steps.some(s => s.depends_on && s.depends_on.length > 0);
      if (!hasDeps) return '';

      // Build adjacency: children[parent] = [child, ...]
      const children = {};
      const hasParent = new Set();
      steps.forEach(s => {
        if (!children[s.name]) children[s.name] = [];
        (s.depends_on || []).forEach(dep => {
          if (!children[dep]) children[dep] = [];
          children[dep].push(s.name);
          hasParent.add(s.name);
        });
      });

      const roots = steps.filter(s => !hasParent.has(s.name)).map(s => s.name);

      function renderNode(name, prefix, isLast) {
        const connector = isLast ? '└─ ' : '├─ ';
        const childPrefix = isLast ? '   ' : '│  ';
        const kids = children[name] || [];
        let out = `<div class="dep-line">${esc(prefix)}${esc(connector)}<span class="dep-leaf">${esc(name)}</span></div>`;
        kids.forEach((kid, i) => {
          out += renderNode(kid, prefix + childPrefix, i === kids.length - 1);
        });
        return out;
      }

      let html = '';
      roots.forEach((root, i) => {
        const isLast = i === roots.length - 1;
        html += renderNode(root, '', isLast);
      });

      return `<div class="card-deps"><div class="card-deps-title">steps</div>${html}</div>`;
    }

    function buildPipelineCard(p) {
      const isRunning = p.last_status === 'RUNNING';
      const badges = [];
      if (p.has_schedule) badges.push('<span class="badge scheduled">⏱ scheduled</span>');
      else badges.push('<span class="badge">manual</span>');
      if (p.teams_chat) badges.push('<span class="badge teams">teams</span>');
      if (isRunning) badges.push('<span class="badge running">↻ running</span>');

      const depsTree = buildDepsTree(p.steps || []);

      const stopBtn = isRunning && p.last_run_id
        ? `<button class="btn danger sm" data-action="stop" data-run-id="${p.last_run_id}">⏹ stop</button>`
        : '';

      return `
    <div class="pipeline-card">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:3px">
        <div class="card-name">${esc(p.name)}</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap">${badges.join('')}</div>
      </div>
      <div class="card-file">${esc(p.file)}</div>
      ${depsTree}
      <div class="card-actions">
        <button class="btn primary" data-action="trigger" data-name="${esc(p.file.replace('.yaml', ''))}" ${isRunning ? 'disabled' : ''}>▶ run</button>
        <button class="btn" data-action="pipeline-history" data-name="${esc(p.name)}">history</button>

    }

        html += `<div class="pipeline-grid">${cards}</div>`;

    function buildBarChart(daily) {
      const W = 380, H = 112;
      const pL = 8, pR = 8, pT = 8, pB = 28;
      const cH = H - pT - pB, cW = W - pL - pR;

      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().slice(0, 10);
        const found = daily.find(x => x.day === key) || {};
        days.push({ label: d.toLocaleDateString('en', { weekday: 'short' }), success: found.success || 0, failed: found.failed || 0 });
      }

      const maxVal = Math.max(1, ...days.map(d => d.success + d.failed));
      const bW = cW / days.length;
      const gap = bW * 0.28;
      const bw = bW - gap;
      let out = '';

      days.forEach((d, i) => {
        const x = (pL + i * bW + gap / 2).toFixed(1);
        const total = d.success + d.failed;
        if (total > 0) {
          const tH = (total / maxVal) * cH;
          const sH = (d.success / total) * tH;
          const fH = tH - sH;
          const baseY = (pT + cH - tH).toFixed(1);
          if (sH > 0) out += `<rect x="${x}" y="${baseY}" width="${bw.toFixed(1)}" height="${sH.toFixed(1)}" fill="var(--accent)" opacity="0.8" rx="1.5"/>`;
          if (fH > 0) out += `<rect x="${x}" y="${(pT + cH - fH).toFixed(1)}" width="${bw.toFixed(1)}" height="${fH.toFixed(1)}" fill="var(--red)" opacity="0.75" rx="1.5"/>`;
        }
        const lx = (pL + i * bW + bW / 2).toFixed(1);
        out += `<text x="${lx}" y="${H - 5}" text-anchor="middle" font-size="9" fill="var(--text-muted)" font-family="monospace">${d.label}</text>`;
      });

      return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" xmlns="http://www.w3.org/2000/svg">${out}</svg>`;
    }

    function buildDonut(success, finished) {
      const r = 36, cx = 54, cy = 56, size = 108, sw = 11;
      const C = +(2 * Math.PI * r).toFixed(2);
      if (finished === 0) {
        return `<svg viewBox="0 0 ${size} ${size + 4}" width="${size}" height="${size + 4}">
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border-2)" stroke-width="${sw}"/>
          <text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="monospace">—</text>
        </svg>`;
      }
      const rate = success / finished;
      const pct = Math.round(rate * 100);
      const sLen = (rate * C).toFixed(2);
      const gLen = ((1 - rate) * C).toFixed(2);
      const color = pct >= 90 ? 'var(--accent)' : pct >= 60 ? 'var(--orange)' : 'var(--red)';
      return `<svg viewBox="0 0 ${size} ${size + 4}" width="${size}" height="${size + 4}">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border-2)" stroke-width="${sw}"/>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
          stroke-dasharray="${sLen} ${gLen}" stroke-linecap="round"
          transform="rotate(-90 ${cx} ${cy})"/>
        <text x="${cx}" y="${cy - 3}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text)" font-family="monospace">${pct}%</text>
        <text x="${cx}" y="${cy + 13}" text-anchor="middle" font-size="8" fill="var(--text-muted)" font-family="monospace">success rate</text>
      </svg>`;
    }

      const pipelineSection = pipelines.length

            <tbody>${pipelineRows}</tbody>
          </table></div>`
        : `<div class="empty" style="padding:32px 0"><div class="empty-sub">no pipeline data yet</div></div>`;

      return `<div class="section-label">dashboard</div>
        ${statCards}
        <div class="chart-row">

            <div class="chart-title">last 7 days</div>

            <div class="chart-legend">
              <span><span style="color:var(--accent)">■</span> success</span>
              <span><span style="color:var(--red)">■</span> failed</span>
            </div>
          </div>
          <div class="chart-card fixed">
            <div class="chart-title">success rate</div>
            <div class="donut-wrap">
              ${buildDonut(totals.success, finished)}
              <div style="font-size:10px;color:var(--text-muted)">${finished} completed</div>
            </div>
          </div>
        </div>
        <div class="section-label">by pipeline</div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden">

    }

    async function render() {
      clearRefresh();
      const main = document.getElementById('main');
      main.innerHTML = '<div class="loading"><div class="spinner"></div> loading</div>';

      const parts = currentRoute();
      const view = parts[0] || 'pipelines';

      try {
        if (view === 'dashboard') {
          main.innerHTML = await viewDashboard();

        } else if (view === 'runs' && parts[1] && parts[2] === 'steps' && parts[3] && parts[4] === 'logs') {
          main.innerHTML = await viewLogs(parts[1], decodeURIComponent(parts[3]));

        } else if (view === 'runs' && parts[1]) {
          main.innerHTML = await viewRun(parts[1]);

        } else if (view === 'history' && parts[1]) {
          main.innerHTML = await viewHistory(decodeURIComponent(parts[1]));

        } else if (view === 'history') {
          main.innerHTML = await viewHistory();

        } else if (view === 'pipelines') {
          main.innerHTML = await viewPipelines();

        } else {
          main.innerHTML = await viewDashboard();
        }
      } catch (err) {
        main.innerHTML = `<div class="empty">
      <div class="empty-glyph">✗</div>
      <div class="empty-title">something went wrong</div>
      <div class="empty-sub">${esc(err.message)}</div>
    </div>`;
      }

      attachHandlers();
    }

    function attachHandlers() {
      const main = document.getElementById('main');

      // Remove previous listener before attaching a new one
      if (main._clickHandler) {
        main.removeEventListener('click', main._clickHandler);
      }

      main._clickHandler = async (e) => {
        const el = e.target.closest('[data-action]');
        const wsToggle = e.target.closest('[data-ws-toggle]');

        // Workspace expand/collapse
        if (wsToggle && !el) {
          wsToggle.classList.toggle('open');
          const body = wsToggle.nextElementSibling;
          if (body) body.classList.toggle('open');
          return;
        }

        if (!el) return;
        const action = el.dataset.action;

        if (action === 'trigger') {
          const name = el.dataset.name;
          el.disabled = true;
          el.textContent = '...';
          try {
            const res = await api.trigger(name);
            toast(`run #${res.run_id} started`, 'ok');
            setTimeout(() => go(`/runs/${res.run_id}`), 400);
          } catch (err) {
            toast(err.message, 'err');
            el.disabled = false;
            el.textContent = '▶ run';
          }
        }

        if (action === 'stop') {
          const runId = el.dataset.runId;
          el.disabled = true;
          el.textContent = '...';
          try {
            await api.stop(runId);
            toast(`run #${runId} stop requested`, 'ok');
            setTimeout(() => render(), 800);
          } catch (err) {
            toast(err.message, 'err');
            el.disabled = false;
            el.textContent = '⏹ stop';
          }
        }

        if (action === 'pipeline-history') {
          go(`/history/${encodeURIComponent(el.dataset.name)}`);
        }

        if (action === 'view-run') {
          go(`/runs/${el.dataset.id}`);
        }

        if (action === 'view-logs') {
          go(`/runs/${el.dataset.run}/steps/${encodeURIComponent(el.dataset.step)}/logs`);
        }
      };

      main.addEventListener('click', main._clickHandler);

      const copyBtn = document.getElementById('btn-copy');
      if (copyBtn) {
        copyBtn.addEventListener('click', () => {
          const txt = document.getElementById('log-content')?.textContent ?? '';
          navigator.clipboard.writeText(txt).then(() => toast('copied to clipboard'));
        });
      }
    }

    window.addEventListener('popstate', render);
    render();
  </script>

  <script>
    // ── Leaf background animation ─────────────────────────────────────────
    (function () {
      const canvas = document.getElementById('leaf-canvas');
      const ctx = canvas.getContext('2d');

      const ACCENT   = 'rgba(0, 229, 153,';   // --accent
      const ACCENT2  = 'rgba(0, 180, 120,';
      const LEAF_COUNT = 77;

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      // Draw a simple leaf shape at origin, pointing up
      function leafPath(ctx, w, h) {
        ctx.beginPath();
        ctx.moveTo(0, -h / 2);
        ctx.bezierCurveTo( w / 2, -h / 4,  w / 2,  h / 4, 0,  h / 2);
        ctx.bezierCurveTo(-w / 2,  h / 4, -w / 2, -h / 4, 0, -h / 2);
        ctx.closePath();
      }

      function rand(a, b) { return a + Math.random() * (b - a); }

      function mkLeaf() {
        const size = rand(7, 22);
        return {
          x:      rand(0, window.innerWidth),
          y:      rand(-100, window.innerHeight + 100),
          w:      size * rand(0.5, 0.8),
          h:      size,
          rot:    rand(0, Math.PI * 2),
          drot:   rand(-0.004, 0.004),
          speed:  rand(0.18, 0.55),
          drift:  rand(-0.12, 0.12),
          alpha:  rand(0.25, 0.7),
          color:  Math.random() > 0.5 ? ACCENT : ACCENT2,
          sway:   rand(0, Math.PI * 2),
          swayS:  rand(0.003, 0.009),
          swayA:  rand(10, 30),
        };
      }

      const leaves = Array.from({ length: LEAF_COUNT }, mkLeaf);

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (const l of leaves) {
          // update
          l.sway += l.swayS;
          l.x    += l.drift + Math.sin(l.sway) * 0.3;
          l.y    += l.speed;
          l.rot  += l.drot;

          // wrap
          if (l.y > canvas.height + 40)  { l.y = -40; l.x = rand(0, canvas.width); }
          if (l.x > canvas.width + 40)   { l.x = -40; }
          if (l.x < -40)                 { l.x = canvas.width + 40; }

          // draw
          ctx.save();
          ctx.translate(l.x, l.y);
          ctx.rotate(l.rot);
          leafPath(ctx, l.w, l.h);
          ctx.fillStyle = l.color + l.alpha + ')';
          ctx.fill();

          // subtle vein line
          ctx.beginPath();
          ctx.moveTo(0, -l.h / 2);
          ctx.lineTo(0,  l.h / 2);
          ctx.strokeStyle = l.color + (l.alpha * 0.4) + ')';
          ctx.lineWidth = 0.5;
          ctx.stroke();

          ctx.restore();
        }

        requestAnimationFrame(draw);
      }

      draw();
    })();
  </script>
</body>

</html>
