[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowa-core"
version = "0.2.2"
authors = [
  { name = "gustavosegre" },
]
description = "Flowa — lightweight pipeline orchestration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["pipeline", "orchestration", "workflow", "scheduler", "airflow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer",
    "pyyaml",
    "apscheduler",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "requests",
    "urllib3",
    "psutil",
]

[project.urls]
Homepage = "https://github.com/gustavosegre/flowa"

[project.scripts]
flowa = "flowa.cli.main:app"

[tool.setuptools.packages.find]
include = ["flowa*"]

[tool.setuptools.package-data]
"flowa.ui.static" = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
